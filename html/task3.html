<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Calculator</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js"></script>
</head>
<body>
    <div class="main">
        <h1>Arithmetic Calculator</h1>
        <div class=box>
            <div class="input-container">
                <input type="number" id="num1" placeholder="Enter first number"> <br>
                <input type="number" id="num2" placeholder="Enter second number">
            </div>
            <div class="operation-buttons">
                <!-- <button onclick="add()">Add</button>
            <button onclick="subtract()">Subtract</button><br>
            <button onclick="multiply()">Multiply</button>
            <button onclick="divide()">Divide</button><br> -->

                <button onclick="calculate_nums('+')">Add</button>
                <button onclick="calculate_nums('-')">Subtract</button> <br>
                <button onclick="calculate_nums('*')">Multiply</button>
                <button onclick="calculate_nums('/')">Divide</button>
            </div>
        </div>
        <div class="result">
            <p id="resultText"></p>
        </div>

    </div>
</body>
</html>
