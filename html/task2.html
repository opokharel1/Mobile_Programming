<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarksCalculator</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js"></script>

</head>

<body>
    <div id="marks_calculator">
        <h1 id="heading">Student Result Calculator</h1>
        <div id="main_area">
            <input type="number" id="maths" placeholder="Enter Marks for Maths"> <br>
            <input type="number" id="science" placeholder="Enter Marks for Science"> <br>
            <input type="number" id="english" placeholder="Enter Marks for English"> <br>
            <input type="number" id="social" placeholder="Enter Marks for Social Studies"> <br>
            <input type="number" id="nepali" placeholder="Enter Marks for Nepali"> <br>
            <input type="number" id="computer" placeholder="Enter Marks for Computer"> <br>


            <button type="button" onclick="calculate()">Submit</button>
        </div>

        <p id="totalMarks"></p>
        <p id="result"></p>
    </div>

</body>

</html>
